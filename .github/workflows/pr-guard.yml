name: PR guard

# README.md, assets/cards/ and data/stars.json are generated by
# scripts/build_readme.py (CI commits them). Contributor PRs must only
# touch data/tools.json — this check turns red with an explanation if a
# PR edits generated files.

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/cards/**"
      - "data/stars.json"

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - name: Explain and fail
        run: |
          echo "::error title=Generated file edited::README.md, assets/cards/ and data/stars.json are generated automatically. To add or change a tool, edit ONLY data/tools.json — the README rebuilds itself. See CONTRIBUTING.md."
          exit 1
