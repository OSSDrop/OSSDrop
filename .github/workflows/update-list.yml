name: Update list

on:
  schedule:
    - cron: "17 3 * * *" # nightly: snapshot stars, recompute trending
  push:
    branches: [main]
    paths: ["data/tools.json", "data/queue.json", "scripts/build_readme.py", "scripts/promote_queue.py"]
  pull_request:
    paths: ["data/tools.json", "scripts/build_readme.py"] # validate drops before merge
  workflow_dispatch:
    inputs:
      backfill_awards:
        description: "One-time: reconstruct ALL past daily/weekly award winners from history"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote due queued tools (daily drip)
        if: github.event_name != 'pull_request'
        run: python scripts/promote_queue.py

      - name: Rebuild README from tools.json
        run: python scripts/build_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/tools.json data/queue.json data/stars.json assets/cards
          git diff --staged --quiet || git commit -m "chore: daily drop + rebuild ($(date -u +%F))"
          git push
          # Hand the exact pushed commit to the site sync: a SHA-pinned raw URL is
          # immutable, so the sync can never read a stale cached list.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Sync website (import newly-dropped tools)
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -n "$SYNC_SECRET" ] && [ -n "$SITE_URL" ]; then
            curl -fsS -X POST "$SITE_URL/api/sync-list?ref=${{ steps.commit.outputs.sha }}" \
              -H "Authorization: Bearer $SYNC_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 90 -w "\nHTTP %{http_code}\n"
          else
            echo "SITE_URL/SYNC_SECRET not set — skipping site sync (add them in repo Action secrets)."
          fi

      - name: Finalize awards (permanent daily/weekly winners)
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -n "$SYNC_SECRET" ] && [ -n "$SITE_URL" ]; then
            Q=""
            if [ "${{ inputs.backfill_awards }}" = "true" ]; then Q="?backfill=1"; fi
            curl -fsS -X POST "$SITE_URL/api/finalize-awards$Q" \
              -H "Authorization: Bearer $SYNC_SECRET" \
              --max-time 90 -w "\nHTTP %{http_code}\n"
          else
            echo "SITE_URL/SYNC_SECRET not set — skipping award finalize."
          fi
