name: Update list

on:
  schedule:
    # Runs twice a day on purpose. Every step below is idempotent, so the second
    # run is a free safety net: if the first is throttled or hits a transient
    # network error, the later one finishes the job without anyone stepping in.
    - cron: "17 3 * * *" # nightly: promote the drip, snapshot stars, sync the site
    - cron: "17 15 * * *" # catch-up: re-runs the same work; a no-op when all is well
  push:
    branches: [main]
    paths: ["data/tools.json", "data/queue.json", "scripts/build_readme.py", "scripts/promote_queue.py"]
  pull_request:
    paths: ["data/tools.json", "scripts/build_readme.py"] # validate drops before merge
  workflow_dispatch:
    inputs:
      backfill_awards:
        description: "One-time: reconstruct ALL past daily/weekly award winners from history"
        type: boolean
        default: false

# Only one run may write to a given ref at a time. Merging two PRs seconds apart
# used to start two runs that raced on `git push`, and one failed with a
# non-fast-forward. Queue them instead of cancelling — every run has work to do.
concurrency:
  group: update-list-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the push retry below rebases onto origin/main, and a
          # shallow clone (the default) cannot rebase across a divergent history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Promote due queued tools (daily drip)
        if: github.event_name != 'pull_request'
        run: python scripts/promote_queue.py

      - name: Rebuild README from tools.json
        run: python scripts/build_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/tools.json data/queue.json data/stars.json assets/cards
          git diff --staged --quiet || git commit -m "chore: daily drop + rebuild ($(date -u +%F))"
          # Rebase-and-retry: if anything landed on main while this run was working
          # (a merged PR, another run), rebase onto it instead of failing the job.
          pushed=0
          for attempt in 1 2 3; do
            if git push; then pushed=1; break; fi
            echo "push rejected — rebasing onto origin/main and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main || git rebase --abort || true
            sleep 5
          done
          if [ "$pushed" != "1" ]; then echo "::error::could not push after 3 attempts"; exit 1; fi
          # Hand the exact pushed commit to the site sync: a SHA-pinned raw URL is
          # immutable, so the sync can never read a stale cached list.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync website (import newly-dropped tools)
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "SITE_URL/SYNC_SECRET not set — skipping site sync (add them in repo Action secrets)."
            exit 0
          fi
          # Retry transient failures (cold start, 5xx, timeout) in-run. The sync is
          # idempotent, so repeating it is always safe.
          curl -fsS -X POST "$SITE_URL/api/sync-list?ref=${{ steps.commit.outputs.sha }}" \
            -H "Authorization: Bearer $SYNC_SECRET" \
            -H "Content-Type: application/json" \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 120 -w "\nHTTP %{http_code}\n"

      - name: Finalize awards (permanent daily/weekly winners)
        if: github.event_name != 'pull_request'
        # Best-effort: awards are a nice-to-have, and the endpoint re-finalizes a
        # rolling window of recent days, so a skipped run heals itself. It must
        # never turn the whole drip red.
        continue-on-error: true
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          if [ -z "$SYNC_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "SITE_URL/SYNC_SECRET not set — skipping award finalize."
            exit 0
          fi
          Q=""
          if [ "${{ inputs.backfill_awards }}" = "true" ]; then Q="?backfill=1"; fi
          curl -fsS -X POST "$SITE_URL/api/finalize-awards$Q" \
            -H "Authorization: Bearer $SYNC_SECRET" \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 120 -w "\nHTTP %{http_code}\n"
